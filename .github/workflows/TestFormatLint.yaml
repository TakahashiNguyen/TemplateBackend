name: Test Format Lint

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACCESS_SECRET: 'ACCESS_SECRET'
  REFRESH_SECRET: 'REFRESH_SECRET'
  SERVER_SECRET: 'SERVER_SECRET'

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  FormatAndLint:
    name: 'Format & Lint'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      project: ${{ steps.filter.outputs.project }}
    steps:
      - uses: actions/checkout@v4

      - id: 'getBranch'
        run: |
          if [[ $GITHUB_REF_NAME == 'master' ]]; then
              echo "test=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
              echo "test='HEAD'" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23.7
          cache: 'pnpm'

      - run: pnpm i && npm run format && npm run lint

      - uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit-action
        with:
          skip_dirty_check: false

      - uses: dorny/paths-filter@v3
        if: steps.auto-commit-action.outputs.changes_detected == 'false'
        id: filter
        with:
          base: ${{ steps.getBranch.outputs.test }}
          filters: |
            project:
              - 'src/**'
              - 'mail/**'
              - 'page/**'
              - 'pnpm-lock.yaml'

  Test:
    needs: FormatAndLint
    if: ${{ needs.FormatAndLint.outputs.project == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: write
      pull-requests: write
    name: Test ${{ matrix.object }}
    strategy:
      matrix:
        object: [service, requesters, etc]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix workspace permissions
        run: |
          sudo chmod -R 777 $GITHUB_WORKSPACE

      - uses: ikalnytskyi/action-setup-postgres@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build image and run make ci-build in dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/takahashinguyen/templatebackend
          cacheFrom: ghcr.io/takahashinguyen/templatebackend
          push: always
          runCmd: npx --yes tsx -e 'import { Client } from "pg"; const c=new Client({connectionString:process.argv[1]}); c.connect().then(()=>console.log("Connected")).catch(e=>console.error("Error",e.message)).finally(()=>c.end())' postgresql://postgres:postgres@host.docker.internal/postgres

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.object }}
          path: |
            ./reports/${{ matrix.object }}.xml
            ./coverage/${{ matrix.object }}.txt

  # Test_web:
  #   needs: FormatAndLint
  #   if: ${{ needs.FormatAndLint.outputs.project == 'true' }}
  #   name: 'Test web'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 5
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         ref: ${{ github.head_ref }}

  #     - uses: ikalnytskyi/action-setup-postgres@v6

  #     - uses: pnpm/action-setup@v4

  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 23.7
  #         cache: 'pnpm'

  #     - run: npm run start:ci

  #     - name: Upload Images
  #       if: failure()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: cypress-images
  #         path: ./cypress/screenshots

  WrapUp:
    name: 'Wrap up'
    needs:
      - Test
      # - Test_web
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: write
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')

      - name: Delete GitHub Actions Comments
        uses: izhangzhihao/delete-comment@master
        with:
          github_token: ${{ github.token }}
          delete_user_name: 'github-actions[bot]'
          issue_number: ${{ github.event.number }}

      - uses: actions/download-artifact@v4

      - name: Requesters
        uses: MishaKav/jest-coverage-comment@main
        with:
          title: Requesters test result
          coverage-path: ./requesters/coverage/requesters.txt
          create-new-comment: true

      - name: Service
        uses: MishaKav/jest-coverage-comment@main
        with:
          title: Service test result
          coverage-path: ./service/coverage/service.txt
          create-new-comment: true

      - uses: dorny/test-reporter@v2
        with:
          artifact: /(.*)/
          name: Tests runtime
          path: '**/*.xml'
          reporter: jest-junit
